#
# GPIO
#
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_ADC=y

#
# No external 32.768 kHz crystal.
# Use the nRF52832 internal low-frequency RC oscillator.
#
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

#
# Console and printk over SEGGER RTT / SWD.
#
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

#
# Logging over RTT.
#
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y

#
# ICM-42670-L bus.
#
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y

#
# C++ application support.
#
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_RTTI=n
CONFIG_CPP_EXCEPTIONS=n

#
# C++ math functions and floating-point printf/scanf support.
#
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CMSIS_DSP=y

#
# Components
#
CONFIG_CMSIS_DSP_BASICMATH=y
# CONFIG_CMSIS_DSP_COMPLEXMATH is not set
# CONFIG_CMSIS_DSP_CONTROLLER is not set
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_FILTERING=y
# CONFIG_CMSIS_DSP_INTERPOLATION is not set
# CONFIG_CMSIS_DSP_MATRIX is not set
# CONFIG_CMSIS_DSP_QUATERNIONMATH is not set
# CONFIG_CMSIS_DSP_STATISTICS is not set
CONFIG_CMSIS_DSP_SUPPORT=y
# CONFIG_CMSIS_DSP_TRANSFORM is not set
# CONFIG_CMSIS_DSP_SVM is not set
# CONFIG_CMSIS_DSP_BAYES is not set
# CONFIG_CMSIS_DSP_DISTANCE is not set
# CONFIG_CMSIS_DSP_WINDOW is not set

#
# Instruction Set
#

#
# Features
#
# CONFIG_CMSIS_DSP_LOOPUNROLL is not set
# CONFIG_CMSIS_DSP_ROUNDING is not set
# CONFIG_CMSIS_DSP_MATRIXCHECK is not set
# CONFIG_CMSIS_DSP_AUTOVECTORIZE is not set
#
# Security Options
#
CONFIG_STACK_POINTER_RANDOM=0

#
# Random Number Generators
#
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y

#
# Stack sizes.
#
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048